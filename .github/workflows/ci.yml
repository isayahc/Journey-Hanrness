name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: timeout 120s npm test
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goal-plan-screenshots
          path: |
            goal-plan-*.png
            github-sync-*.png
          if-no-files-found: ignore
  setup:
    timeout-minutes: 8
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run opencode -- --version
      - run: node --test tests/setup.test.mjs
